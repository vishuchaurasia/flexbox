{% for product in products %}
<div class="col-6 col-lg-3">
  <a href="{{ url_for("product.show", id=product.id) }}" class="product-card">
    <div class="card h-100 product-card__card">
      <div class="ratio ratio-1x1">
        <img class="lazyload lazypreload product-card__img" alt="" src="{{ product.first_img }}" data-src="{{ product.first_img }}">
      </div>
      <div class="card-body p-3">
        <div class="product-card__title" title="{{ product.title }}">{{ product.title }}</div>
      </div>
      <div class="card-footer bg-transparent border-0 pt-0 pb-3 px-3">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <div class="product-card__price">${{ product.price }}</div>
          {% if product.is_discounted %}
            <span class="product-card__badge">{% trans %}Sale{% endtrans %}</span>
          {% endif %}
        </div>
      </div>
    </div>
  </a>
</div>
{% endfor %}
