{% for product in products %}
<div class="col-12 col-sm-6 col-lg-4 col-xl-3">
  <a href="{{ url_for("product.show", id=product.id) }}" class="product-link">
    <div class="product-card">
      <div class="product-img-wrapper">
        <img class="product-img" 
             src="https://via.placeholder.com/300x300/f0f0f0/999?text=Loading..." 
             data-src="{{ product.first_img or 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80' }}" 
             alt="{{ product.title }}"
             loading="lazy">
        {% if product.is_discounted %}
          <span class="product-badge sale">Sale</span>
        {% endif %}
      </div>
      <div class="product-info">
        <h3 class="product-title">{{ product.title[:40] }}</h3>
        <div class="product-price-row">
          <span class="product-price">${{ "%.2f"|format(product.price) }}</span>
          {% if product.is_discounted %}
            <span class="product-original">${{ "%.2f"|format(product.basic_price) }}</span>
          {% endif %}
        </div>
      </div>
      <button class="product-cart-btn">Add to Cart</button>
    </div>
  </a>
</div>
{% endfor %}

<script>
document.addEventListener('DOMContentLoaded', function() {
  const images = document.querySelectorAll('[data-src]');
  images.forEach(img => {
    const src = img.getAttribute('data-src');
    const newImg = new Image();
    newImg.onload = function() {
      img.src = src;
      img.style.opacity = '1';
    };
    newImg.onerror = function() {
      img.src = 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80';
    };
    newImg.src = src;
  });
});
</script>

<style>
.product-link {
  text-decoration: none;
  color: inherit;
  display: block;
}

.product-card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.product-link:hover .product-card {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.product-img-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, #f5f5f5, #fafafa);
  overflow: hidden;
}

.product-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
  opacity: 0;
  animation: fadeIn 0.5s ease-in forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.product-link:hover .product-img {
  transform: scale(1.08);
}

.product-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #e74c3c;
  color: white;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
}

.product-badge.sale {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
}

.product-info {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

.product-title {
  margin: 0 0 8px 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  color: #333;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.product-price-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.product-price {
  font-size: 16px;
  font-weight: bold;
  color: #2874f0;
}

.product-original {
  font-size: 12px;
  color: #999;
  text-decoration: line-through;
}

.product-cart-btn {
  width: 100%;
  padding: 8px;
  background: #2874f0;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 13px;
}

.product-cart-btn:hover {
  background: #1f5fd1;
  transform: scale(1.02);
}

@media (max-width: 768px) {
  .product-card {
    border-radius: 6px;
  }
  
  .product-title {
    font-size: 13px;
  }
  
  .product-price {
    font-size: 15px;
  }
}
</style>
